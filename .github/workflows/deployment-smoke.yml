name: Deployment Smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: deployment-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENTCLINIC_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      AGENTCLINIC_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run read-only release smoke checks
        run: npm run smoke:release
